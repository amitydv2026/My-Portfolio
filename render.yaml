services:
  - type: web
    name: amit-yadav-portfolio
    runtime: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://amit-yadav-portfolio.onrender.com
      - key: DB_DIR
        value: /data
    disk:
      name: portfolio-db
      mountPath: /data
      sizeGB: 1
